{% extends 'movies/base.html' %}

{% block content %}
<div style="display: flex; justify-content: center; margin-top: 60px;">
    
    <div style="background-color: #e0e0e0; padding: 40px; border-radius: 12px; width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
        
        <!-- Header -->
        <div style="text-align: center; border: 2px solid #333; border-radius: 20px; padding: 10px; margin-bottom: 40px; background: #f5f5f5;">
            <h2 style="margin: 0; color: #1a1438; font-family: serif;">Login to Cinefilm</h2>
        </div>
        
        <!-- Form -->
        <form>
            <div style="margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;">
                <label style="font-weight: bold; color: #1a1438;">Mail/Contact :</label>
                <input type="text" style="padding: 10px; border: 1px solid #333; width: 60%;">
            </div>
            
            <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                <label style="font-weight: bold; color: #1a1438;">Password :</label>
                <input type="password" style="padding: 10px; border: 1px solid #333; width: 60%;">
            </div>
            
            <div style="text-align: right; margin-bottom: 30px;">
                <a href="#" style="color: #1a1438; text-decoration: underline; font-size: 0.9rem;">Forgot Pass</a>
            </div>
            
            <button type="button" style="width: 100%; padding: 15px; background-color: #3b4b59; color: #d4af37; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 4px;">
                LOGIN
            </button>
        </form>

    </div>
</div>
{% endblock content %}
